name: Package and Publish Extension

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Build, Release, and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write


    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Get Version from manifest.json
        id: get_version
        run: |
          VERSION=$(jq -r .version manifest.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "::set-output name=version::$VERSION"

      - name: Zip Extension Files
        run: |
          zip -r douyin-chat-suffix.zip manifest.json content.js settings.js popup.html popup.css popup.js vendor icon16.png icon48.png icon128.png README.md PRIVACY.md LICENSE

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          name: Release v${{ env.VERSION }} (Build #${{ github.run_number }})
          draft: false
          prerelease: false
          files: |
            douyin-chat-suffix.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
