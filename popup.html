<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>抖音直播发言自动后缀</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo-container">
        <svg viewBox="0 0 100 100" class="logo-svg">
          <circle cx="50" cy="53" r="38" fill="url(#tomatoGrad)" />
          <path d="M50,15 Q52,5 40,8 Q35,10 42,18" stroke="#4CAF50" stroke-width="6" stroke-linecap="round" fill="none" />
          <path d="M50,15 Q45,3 58,5 Q62,8 55,17" stroke="#388E3C" stroke-width="5" stroke-linecap="round" fill="none" />
          <defs>
            <linearGradient id="tomatoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FF6B4A" />
              <stop offset="100%" stop-color="#E52D27" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1>抖音发言后缀助手</h1>
      <p class="subtitle">Douyin Live Chat Suffix</p>
    </div>

    <div class="divider"></div>

    <div class="form-group">
      <label class="switch-label">
        <span class="label-text">启用自动后缀</span>
        <div class="switch">
          <input type="checkbox" id="enabled-toggle" checked>
          <span class="slider"></span>
        </div>
      </label>
    </div>

    <div class="form-group" id="suffix-container">
      <label for="suffix-input" class="input-label">发言后缀</label>
      <div class="input-wrapper">
        <input type="text" id="suffix-input" value=" /西红柿" placeholder="例如：/西红柿">
        <span class="input-focus-line"></span>
      </div>
    </div>

    <div class="status-msg" id="status-text">设置已自动保存</div>

    <div class="footer">
      <span>Version 1.0</span>
      <span class="dot">•</span>
      <span>Verified Stable</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
