<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>抖音直播发言自动后缀</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo-container">
        <svg viewBox="0 0 100 100" class="logo-svg">
          <circle cx="50" cy="53" r="38" fill="url(#tomatoGrad)" />
          <path d="M50,15 Q52,5 40,8 Q35,10 42,18" stroke="#4CAF50" stroke-width="6" stroke-linecap="round" fill="none" />
          <path d="M50,15 Q45,3 58,5 Q62,8 55,17" stroke="#388E3C" stroke-width="5" stroke-linecap="round" fill="none" />
          <defs>
            <linearGradient id="tomatoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FF6B4A" />
              <stop offset="100%" stop-color="#E52D27" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1>抖音发言后缀助手</h1>
      <p class="subtitle">Douyin Live Chat Suffix</p>
    </div>

    <div class="divider"></div>

    <div class="form-group">
      <label class="switch-label">
        <span class="label-text">启用</span>
        <div class="switch">
          <input type="checkbox" id="enabled-toggle" checked>
          <span class="slider"></span>
        </div>
      </label>
    </div>

    <div class="form-group" id="suffix-container">
      <label class="input-label">发言后缀</label>
      <div class="select-row">
        <div class="select-wrapper prefix-select">
          <label for="suffix-prefix" class="select-label">符号</label>
          <select id="suffix-prefix">
            <option value="(" selected>(</option>
            <option value="/">/</option>
          </select>
        </div>
        <div class="select-wrapper preset-select">
          <label for="suffix-preset" class="select-label">内容</label>
          <div class="select-control">
            <select id="suffix-preset"></select>
          </div>
        </div>
      </div>
      <div class="custom-preset-row">
        <input
          type="text"
          id="custom-preset-input"
          maxlength="24"
          placeholder="新增自订内容"
          aria-label="新增自订内容"
        >
        <button type="button" id="add-preset" aria-label="新增内容">新增</button>
        <button type="button" id="delete-preset" aria-label="删除选取内容">删除</button>
      </div>
      <p class="preset-hint" id="preset-hint">预设内容会保留，自订内容可删除</p>
    </div>

    <div class="form-group">
      <label class="switch-label">
        <span class="label-text">发送前转为简体</span>
        <div class="switch">
          <input type="checkbox" id="convert-toggle" checked>
          <span class="slider"></span>
        </div>
      </label>
    </div>

    <div class="status-msg" id="status-text">设置已自动保存</div>

    <div class="footer">
      <span>Version 1.2</span>
      <span class="dot">•</span>
      <span>Verified Stable</span>
    </div>
  </div>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
